      - "08:10-09:00  ZOOL 518 - Parsons N104"
      - "10:10-11:00  BMCB 658 - MUB 312"
      - "13:00-17:00  WORK"
    events:
      - id: mon_briefing
        time: "06:30"
        template: morning_briefing
      - id: mon_zool_transition
        time: "07:45"
        template: transition
        vars:
          minutes: 25
          what: "ZOOL 518 at 8:10"
          where: "Parsons N104"
          extra: "Notebook and pen, not the laptop."
      - id: mon_bmcb_transition
        time: "09:45"
        template: transition
        vars:
          minutes: 25
          what: "BMCB 658 at 10:10"
          where: "MUB 312"
          extra: "Walk straight there. Do not route past your room."
      - id: mon_post_class
        time: "11:05"
        template: post_class
        vars:
          what: "BMCB 658"
          next_step: "eat, then be at work by 1:00"
      - id: mon_pre_work_fuel
        time: "12:15"
        template: pre_work_fuel
        vars:
          detail: "Shift starts at 1:00 and runs to 5:00."
      - id: mon_work_transition
        time: "12:45"
        template: transition
        vars:
          minutes: 15
          what: "WORK at 1:00"
          where: "your work site"
          extra: "Water bottle filled before you walk in."
      - id: mon_fuel
        time: "15:45"
        template: fuel_preemptive
      - id: mon_work_wrapup
        time: "16:45"
        template: work_wrapup
        vars:
          minutes: 15
          end_time: "5:00"
      - id: mon_reentry
        time: "17:20"
        template: post_work_reentry
        vars:
          task: "eat a real dinner, then 30 minutes on the nearest deadline"
      - id: mon_music_warning
        time: "19:45"
        template: music_warning
      - id: mon_music_stop
        time: "20:00"
        template: music_hard_stop
      - id: mon_mvd
        time: "21:00"
        template: mvd_check
        requires_ack: true
      - id: mon_shutdown
        time: "22:30"
        template: shutdown
        vars:
          first_action: "shower, then ZOOL at 8:10"

