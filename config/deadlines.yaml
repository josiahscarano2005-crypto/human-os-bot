# Academic deadlines - administrative reminder data only.
# This bot never produces coursework. It only tells you what is due and when to start.
#
# Fields:
#   id      unique, never reused (used for de-duplication)
#   course  short course code
#   title   what it is
#   due     "YYYY-MM-DD HH:MM" local time (America/New_York)
#   dod     Definition of Done - what "finished" physically means
#   status  pending | submitted | accepted_drop   (edit this as things close out)
#   remind_days_before  overrides the policy below for a single item

reminder_policy:
  # Days-before -> time of day the alert fires.
  alert_times:
    "5": "17:00"
    "3": "17:00"
    "1": "19:30"
    "0": "07:00"
  default_remind_days_before: [3, 1, 0]
  # How far ahead the morning briefing looks.
  briefing_lookahead_days: 5
  # Overdue pending items keep showing in the briefing for this many days.
  overdue_nag_days: 7

