# Human OS recurring schedule.
#
# HOW TO EDIT SAFELY
#   - Times are 24-hour "HH:MM" in the timezone below.
#   - Every event needs a unique `id` (used for de-duplication). Never reuse one.
#   - `template` must exist in config/messages.yaml. `vars` fill its {placeholders}.
#   - `variant: name` means the event only fires when that name is listed in
#     active_variants. Events with no variant always fire.
#   - Run `python scripts/validate_config.py` after editing. It will catch typos.

timezone: America/New_York

# Flip these as reality changes (boss conversation, lab registration).
variants:
  work_tuesday: "CURRENT: work Tue 10:00-16:00 (conflicts with ZOOL lab)"
  no_work_tuesday: "PROPOSED: Tuesday is a library deep-work day"
  work_thursday: "PROPOSED: work Thu 10:00-16:00"
  zool_lab_l04: "ZOOL 518 lab L04, Wed 13:10-15:30, Rudman G31"
  ansc_r04: "ANSC 612 recitation R04, Wed 12:10-13:00, Ham-Smith 126"

active_variants:
  - work_tuesday
  - zool_lab_l04
  - ansc_r04

defaults:
  # How late a message may still be delivered if GitHub Actions runs late.
  grace_minutes: 40
  # Nothing is ever sent outside this local window.
  quiet_hours_start: "23:30"
  quiet_hours_end: "06:00"
  # Escalation behaviour for events with `requires_ack: true`.
  ack:
    escalate_after_minutes: 25
    max_escalations: 2
    expire_after_minutes: 150
    escalation_templates:
      - mvd_escalation_1
      - mvd_escalation_2

days:

  monday:
