name: Human OS Bot

on:
  schedule:
    # Times are UTC. These two windows cover roughly 04:00-01:00 America/New_York
    # all year, including daylight saving shifts. The bot itself enforces quiet
    # hours, so anything outside your waking window exits in a few seconds.
    - cron: '*/5 9-23 * * *'
    - cron: '*/5 0-5 * * *'
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: true
        default: 'run'
        type: choice
        options: [run, test, dry-run, list]
      only_event:
        description: 'Single event id to fire (e.g. mon_briefing)'
        required: false
        type: string
      at_time:
        description: 'Simulate a local time, e.g. 2026-09-14 06:31'
        required: false
        type: string

# Never let two runs fight over the state file.
concurrency:
  group: human-os-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate configuration
        run: python scripts/validate_config.py

  run-bot:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate configuration
        run: python scripts/validate_config.py

      - name: Run Human OS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'run' }}
          ONLY_EVENT: ${{ inputs.only_event }}
          AT_TIME: ${{ inputs.at_time }}
        run: |
          set -euo pipefail
          ARGS=()
          case "$MODE" in
            test)    ARGS+=(--test) ;;
            dry-run) ARGS+=(--dry-run) ;;
            list)    ARGS+=(--list) ;;
          esac
          if [ -n "${ONLY_EVENT}" ]; then ARGS+=(--only "${ONLY_EVENT}" --force); fi
          if [ -n "${AT_TIME}" ]; then ARGS+=(--at "${AT_TIME}"); fi
          python -m src.main "${ARGS[@]}"

      - name: Persist state
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "No state change."
            exit 0
          fi
          git config user.name  "human-os-bot"
          git config user.email "human-os-bot@users.noreply.github.com"
          git add state/
          git commit -m "state: $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done
          echo "::warning::Could not persist state; the next run may repeat a message."
